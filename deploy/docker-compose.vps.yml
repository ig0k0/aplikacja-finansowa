# VPS (np. Oracle Cloud): aplikacja za Caddy (HTTPS).
# Uruchamiaj z katalogu glownego repozytorium, zawsze z jawnym --env-file:
#   docker compose --env-file .env -f deploy/docker-compose.vps.yml up -d --build
# (bez --env-file Compose szuka .env w katalogu deploy/).
# Wymaga w .env: SESSION_SECRET, CFO_DOMAIN. Skrypt deploy/oci/deploy.sh robi to automatycznie.

name: cfo

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  restart: unless-stopped

services:
  app:
    <<: *hardening
    build:
      context: ..
      dockerfile: Dockerfile
    # CFO_IMAGE w .env = gotowy obraz z GHCR (budowany przez GitHub Actions); brak = build lokalny.
    image: ${CFO_IMAGE:-cfo-app:latest}
    # Port 3000 NIE jest publikowany na hoscie — dostep tylko z Caddy w sieci Dockera.
    expose:
      - "3000"
    environment:
      DATABASE_URL: /app/data/app.db
      NODE_ENV: production
      APP_URL: https://${CFO_DOMAIN:?Set CFO_DOMAIN}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      FORCE_HSTS: ${FORCE_HSTS:-1}
      LOGIN_RATE_LIMIT_MAX: ${LOGIN_RATE_LIMIT_MAX:-8}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_DESTINATION: /app/backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      GOOGLE_DRIVE_RCLONE_REMOTE: ${GOOGLE_DRIVE_RCLONE_REMOTE:-}
      GOOGLE_DRIVE_RCLONE_PATH: ${GOOGLE_DRIVE_RCLONE_PATH:-}
      AI_MODE: ${AI_MODE:-disabled}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_CONFIDENCE_AUTO: ${AI_CONFIDENCE_AUTO:-}
      AI_CONFIDENCE_REVIEW: ${AI_CONFIDENCE_REVIEW:-}
    volumes:
      - app-data:/app/data
      - ${CFO_BACKUP_DIR:-../backups}:/app/backups
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: ${CFO_APP_MEM_LIMIT:-2g}
    pids_limit: 512
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  caddy:
    <<: *hardening
    image: caddy:2-alpine
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CFO_DOMAIN: ${CFO_DOMAIN:?Set CFO_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 256m
    pids_limit: 256
    depends_on:
      app:
        condition: service_healthy

volumes:
  app-data:
  caddy-data:
  caddy-config:
